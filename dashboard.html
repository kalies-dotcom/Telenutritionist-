

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify Client Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    header {
      background: #fff;
      padding: 20px 6%;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { font-size: 22px; margin: 0; }
    main { max-width: 1200px; margin: 35px auto; padding: 0 20px; }
    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 7px;
      background: #176b4d;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .secondary { background: #374151; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: white;
      padding: 22px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }
    .stat span { color: #6b7280; font-size: 14px; }
    .stat strong { display: block; font-size: 27px; margin-top: 10px; }
    .table-wrap { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }
    th { background: #f9fafb; }
    #notice { margin-top: 16px; color: #4b5563; }
    @media (max-width: 600px) {
      header { padding: 16px; }
      main { margin-top: 20px; padding: 0 12px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Nutrify Client Dashboard</h1>
    <button id="logout" class="secondary" hidden>Log out</button>
  </header>

  <main>
    <section class="panel" id="loginPanel">
      <h2>Client login</h2>
      <p>Sign in to view consultation bookings and export records.</p>
      <form id="loginForm">
        <p>
          <label for="email">Email address</label><br><br>
          <input id="email" type="email" autocomplete="username"
            required style="width:100%;padding:12px">
        </p>
        <p>
          <label for="password">Password</label><br><br>
          <input id="password" type="password" autocomplete="current-password"
            required style="width:100%;padding:12px">
        </p>
        <button type="submit" id="loginButton">Sign in</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="stats">
        <div class="stat">
          <span>Total bookings</span>
          <strong id="totalBookings">—</strong>
        </div>
        <div class="stat">
          <span>Confirmed bookings</span>
          <strong id="confirmedBookings">—</strong>
        </div>
      </div>

      <section class="panel">
        <div class="actions">
          <div>
            <h2>Consultation bookings</h2>
            <p>Customer records from Supabase.</p>
          </div>
          <div>
            <button id="refreshButton" class="secondary">Refresh</button>
            <button id="exportButton">Download Excel</button>
          </div>
        </div>

        <div id="notice" role="status">Please sign in to continue.</div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Customer</th>
                <th>Email</th>
                <th>WhatsApp</th>
                <th>Date</th>
                <th>Time</th>
                <th>Nutritionist</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="bookingRows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    // The secure login, booking retrieval and Excel export
    // will be connected to your Vercel backend in the next step.
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("notice").textContent =
        "Login is not connected yet. Please wait for the backend setup.";
    });
  </script>
</body>
</html>
